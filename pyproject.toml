[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "splashback"
version = "1.0.0"
description = "A top-down arena game where you paint away grey gloom creatures."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []

[project.scripts]
splashback = "splashback.cli:main"

[tool.setuptools]
packages = ["splashback"]
